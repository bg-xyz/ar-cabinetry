# XcodeGen spec: the cloud Mac turns this into Cabinets.xcodeproj (never edited by hand).
name: Cabinets
options:
  bundleIdPrefix: xyz.bg
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6L8KT5D4MQ
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cabinets:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/Designs
        type: folder
      - path: Resources/Textures
        type: folder
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Cabinets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: The camera and LiDAR scanner measure your room so your cabinets fit and appear in place.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bg.cabinets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
    scheme: {}
