# XcodeGen spec: the cloud Mac turns this into Cabinets.xcodeproj (never edited by hand).
name: Cabinets
options:
  bundleIdPrefix: xyz.bg
  deploymentTarget:
    iOS: "17.0"
    visionOS: "2.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6L8KT5D4MQ
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cabinets:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
      - path: Resources/Assets.xcassets
      - path: Resources/Designs
        type: folder
      - path: Resources/plywise-engine.js
        buildPhase: resources
      - path: Resources/Textures
        type: folder
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Plywise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: The camera and LiDAR scanner measure your room so your cabinets fit and appear in place.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bg.cabinets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
    scheme: {}

  # Vision Pro: the same engine, models, textures and design language (Sources/Shared), with a
  # glass window, a volumetric 3D preview and an immersive space that places it on your wall.
  PlywiseVision:
    type: application
    platform: visionOS
    sources:
      - path: Sources/Shared
      - path: Sources/Vision
      - path: Resources/Designs
        type: folder
      - path: Resources/plywise-engine.js
        buildPhase: resources
      - path: Resources/Textures
        type: folder
    info:
      path: Vision-Info.plist
      properties:
        CFBundleDisplayName: Plywise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSWorldSensingUsageDescription: Vision Pro finds your walls so your cabinets fit the space, stand where they will be built, and are still there when you come back.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.bg.cabinets
        TARGETED_DEVICE_FAMILY: "7"
        CODE_SIGN_STYLE: Manual
    scheme: {}
