<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabinet preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23B4955A'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #ece9e4; font: 14px system-ui, sans-serif; overflow: hidden; }
  #ui { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,.93); padding: 12px 14px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.15); width: 250px; }
  #ui h1 { font-size: 15px; margin: 0 0 2px; }
  #info { color: #555; font-size: 12px; margin-bottom: 6px; }
  #ui label { display: block; margin-top: 4px; cursor: pointer; }
  #ui select { width: 100%; margin: 2px 0 4px; font: inherit; }
  .k { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: .04em; margin-top: 8px; }
  #hover { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,.72); color: #fff; padding: 4px 10px; border-radius: 6px; display: none; }
  #hint { position: absolute; bottom: 12px; right: 12px; color: #777; font-size: 12px; }
  #inroom { margin-top: 10px; width: 100%; padding: 8px 10px; font: inherit; font-weight: 600; color: #1c1915; background: #c9a25e; border: 0; border-radius: 4px; cursor: pointer; }
  #photo { margin-top: 10px; width: 100%; padding: 8px 10px; font: inherit; font-weight: 600; color: #f1e6d6; background: #3e2a1e; border: 0; border-radius: 4px; cursor: pointer; }
  #photoNote { font-size: 12px; color: #555; margin-top: 6px; }
  #further button { display: block; width: 100%; margin-top: 4px; padding: 5px 0; font: inherit; font-size: 13px; text-align: left; color: #3e2a1e; background: none; border: 0; border-bottom: 1px solid rgba(0,0,0,.08); cursor: pointer; }
  #further [hidden] { display: none; }
  #further textarea { width: 100%; height: 90px; margin-top: 6px; font: 11px ui-monospace, monospace; box-sizing: border-box; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <h1 id="title"></h1>
  <div id="info"></div>
  <div class="k">Fronts</div><select id="f-fronts"></select>
  <div class="k">Cabinet</div><select id="f-carcass"></select>
  <div class="k">Top</div><select id="f-top"></select>
  <label><input type="checkbox" id="open"> Open doors / pull drawers</label>
  <label><input type="checkbox" id="fronts" checked> Show fronts</label>
  <label><input type="checkbox" id="top" checked> Show countertop + sink</label>
  <label><input type="checkbox" id="room" checked> Wall + floor</label>
  <button id="inroom" hidden title="Opens Apple AR Quick Look: the piece life-size in your room">View in your room</button>
  <button id="photo" title="Downloads a clean render and copies a prompt: paste both into any image AI">Make it a photo</button>
  <div id="photoNote"></div>
  <div id="further">
    <div class="k">Take it further</div>
    <button id="glb" title="glTF binary, metres, every part a named object: opens in Blender (free) and most 3D tools">Download 3D for Blender (.glb)</button>
    <button id="usdzfile" title="USDZ: Reality Composer, Keynote, Blender">Download 3D (.usdz)</button>
    <button id="aicopy" hidden title="Copies the design and instructions: paste into any AI chat and ask for changes">Edit with any AI (copy design)</button>
    <button id="aipaste" hidden>Paste an edited design</button>
    <textarea id="aitext" hidden placeholder="Paste the design the AI gave back, then press Load"></textarea>
    <button id="aiload" hidden>Load it</button>
    <div id="aiNote" class="k" style="text-transform:none;letter-spacing:0"></div>
  </div>
</div>
<div id="hover"></div>
<div id="hint">Drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const DATA = /*PARTS_JSON*/null;
const $ = (id) => document.getElementById(id);
$('title').textContent = DATA.name;
const ov = DATA.overall;
const inch = (mm) => (mm / 25.4).toFixed(1) + '"';
$('info').textContent = `${DATA.style} - ${inch(ov.width)} W x ${inch(ov.height)} H x ${inch(ov.depth)} D`;

// ---- renderer: physically based, tone mapped, lit by a studio-room environment
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xece9e4);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 10, 30000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const sun = new THREE.DirectionalLight(0xfff4e6, 2.2);
sun.position.set(-900, 2600, 2600);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.radius = 6;
sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, { left: -2200, right: 2200, top: 2200, bottom: -2200, near: 100, far: 8000 });
scene.add(sun, new THREE.HemisphereLight(0xffffff, 0xb8a990, 0.35));

// ---- textures + finishes
const loader = new THREE.TextureLoader();
const texCache = new Map();
function tex(key, map) {
  const id = key + '/' + map;
  if (!texCache.has(id)) {
    const t = loader.load(DATA.textures[key][map]);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    if (map === 'color') t.colorSpace = THREE.SRGBColorSpace;
    texCache.set(id, t);
  }
  return texCache.get(id);
}
const matCache = new Map();
function finishMat(finishId, kind) { // kind: 'face' | 'edge'
  const id = finishId + '|' + kind;
  if (matCache.has(id)) return matCache.get(id);
  const f = DATA.finishes[finishId];
  const m = new THREE.MeshPhysicalMaterial({ roughness: f.roughness, clearcoat: f.clearcoat, clearcoatRoughness: 0.55 });
  const key = kind === 'face' ? f.texture : f.edge;
  if (f.paint) {
    m.color.set(f.paint);
  } else if (key && DATA.textures[key]) {
    m.map = tex(key, 'color');
    m.normalMap = tex(key, 'normal');
    const ns = kind === 'face' ? (f.normalScale ?? 0.4) : 0.5;
    m.normalScale.set(ns, ns);
    m.roughnessMap = tex(key, 'roughness');
    m.color.set(f.tint ?? '#ffffff');
  }
  matCache.set(id, m);
  return m;
}

// UVs in real millimetres so grain and plies are true to scale: veneer grain runs along
// the part's grain axis; on edges the plies stack through the thickness.
const VENEER_TILE = 900;   // mm of veneer per texture tile
const PLY_PAIRS = 64;      // light/dark ply pairs in one tile of the edge texture
// A part is drawn as one box, or as several boxes when through-cuts (notches, plumbing
// holes) are taken out of it. UVs are in world space, so the pieces join seamlessly.
function subtract(boxes, cut) {
  const out = [];
  for (const b of boxes) {
    const lo = b.min, hi = b.max;
    if ([0, 1, 2].some((a) => cut.max[a] <= lo[a] || cut.min[a] >= hi[a])) { out.push(b); continue; }
    const c0 = cut.min.map((v, a) => Math.max(v, lo[a])), c1 = cut.max.map((v, a) => Math.min(v, hi[a]));
    // slice along x, then y, then z: up to 6 pieces around the cut
    let rest = { min: [...lo], max: [...hi] };
    for (let a = 0; a < 3; a++) {
      if (c0[a] > rest.min[a]) { const piece = { min: [...rest.min], max: [...rest.max] }; piece.max[a] = c0[a]; out.push(piece); rest.min[a] = c0[a]; }
      if (c1[a] < rest.max[a]) { const piece = { min: [...rest.min], max: [...rest.max] }; piece.min[a] = c1[a]; out.push(piece); rest.max[a] = c1[a]; }
    }
  }
  return out.filter((b) => [0, 1, 2].every((a) => b.max[a] - b.min[a] > 0.01));
}
function partPieces(p) {
  let boxes = [{ min: [...p.box.min], max: p.box.min.map((v, a) => v + p.box.size[a]) }];
  for (const c of p.cuts ?? []) boxes = subtract(boxes, c);
  return boxes;
}
// True-to-life grain: the veneer at a point of a face is the veneer at that point of the sheet the
// part was cut from (engine/src/model3d.ts). Grain runs along the sheet's length (x). Face B (the
// underside on the CNC) is the sheet's other side, which has its own figure.
function sheetUV(p, w) {
  const s = p.sheet, min = p.box.min, size = p.box.size, n = p.thicknessAxis;
  const U = s.uSign > 0 ? w[s.u] - min[s.u] : min[s.u] + size[s.u] - w[s.u];
  const V = w[s.v] - min[s.v];
  const X = s.rot ? s.x + (s.w - V) : s.x + U, Y = s.rot ? s.y + U : s.y + V;
  const faceA = Math.abs(w[n] - (s.faceA > 0 ? min[n] + size[n] : min[n])) < 0.5;
  const ox = (s.i * 0.618) % 1 + (faceA ? 0 : 0.43), oy = (s.i * 0.381) % 1 + (faceA ? 0 : 0.29);
  return [X / VENEER_TILE + ox, Y / VENEER_TILE + oy];
}
function partGeometry(p, piece) {
  const size = [0, 1, 2].map((a) => piece.max[a] - piece.min[a]);
  const [sx, sy, sz] = size;
  const g = new THREE.BoxGeometry(sx, sy, sz);
  const pos = g.attributes.position, uv = g.attributes.uv;
  const n = p.thicknessAxis, inPlane = [0, 1, 2].filter((a) => a !== n);
  const grain = p.grainAxis !== null && p.grainAxis !== n ? p.grainAxis
    : (p.box.size[inPlane[0]] >= p.box.size[inPlane[1]] ? inPlane[0] : inPlane[1]);
  const across = inPlane.find((a) => a !== grain);
  // banded edges wear the face veneer (grain along the edge); raw ones show the plies
  const plyTile = p.banded ? VENEER_TILE : PLY_PAIRS * 2 * p.box.size[n] / p.plies;
  let h = 0; for (const c of p.texSeed ?? p.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;   // stable offset, shared by a grain-matched group
  const ou = (h % 997) / 997, ovv = ((h >> 10) % 991) / 991;
  for (let f = 0; f < 6; f++) {
    const m = f >> 1;
    for (let i = f * 4; i < f * 4 + 4; i++) {
      const w = [pos.getX(i) + sx / 2 + piece.min[0], pos.getY(i) + sy / 2 + piece.min[1], pos.getZ(i) + sz / 2 + piece.min[2]]; // world mm
      if (m === n && p.sheet) uv.setXY(i, ...sheetUV(p, w));
      else if (m === n) uv.setXY(i, w[grain] / VENEER_TILE + ou, w[across] / VENEER_TILE + ovv);
      else {
        const along = [0, 1, 2].find((a) => a !== m && a !== n);
        uv.setXY(i, w[along] / VENEER_TILE + ou, (w[n] - p.box.min[n]) / plyTile + ovv);
      }
    }
  }
  return g;
}

// which finish each part shows (mirrors engine/src/job.ts finishFor)
const choice = { fronts: null, carcass: null, top: null };
const isFront = (r) => r === 'door' || r === 'drawerFront';
function finishOf(p) {
  if (isFront(p.role) || p.role === 'endPanel') return choice.fronts;
  if (p.role === 'top') return choice.top;
  if (p.role.startsWith('drawer') || (p.role === 'back' && !p.exposed)) return 'birch';
  return choice.carcass;
}
const first = (pred) => DATA.parts.find(pred)?.finish ?? 'birch';
choice.fronts = first((p) => isFront(p.role));
choice.carcass = first((p) => p.role === 'side');
choice.top = first((p) => p.role === 'top');

// ---- build the cabinets
const group = new THREE.Group();
group.position.y = ov.elevation;
scene.add(group);
const meshes = [];
for (const p of DATA.parts) {
  // one group per part (moves as a unit when doors open); one mesh per piece
  const node = new THREE.Group();
  const [sx, sy, sz] = p.box.size, [mx, my, mz] = p.box.min;
  node.position.set(mx + sx / 2, my + sy / 2, mz + sz / 2);
  for (const piece of partPieces(p)) {
    const mesh = new THREE.Mesh(partGeometry(p, piece));
    mesh.position.set((piece.min[0] + piece.max[0]) / 2 - node.position.x, (piece.min[1] + piece.max[1]) / 2 - node.position.y, (piece.min[2] + piece.max[2]) / 2 - node.position.z);
    mesh.castShadow = mesh.receiveShadow = true;
    mesh.userData = p;
    node.add(mesh);
  }
  node.userData = { ...p, home: node.position.clone() };
  group.add(node);
  meshes.push(node);
}
function applyFinishes() {
  for (const node of meshes) {
    const p = node.userData, fid = finishOf(p);
    const mats = [0, 1, 2, 3, 4, 5].map((f) => finishMat(fid, (f >> 1) === p.thicknessAxis || p.banded ? 'face' : 'edge'));
    for (const m of node.children) m.material = mats;
  }
}

// ---- bought items: vessel sink, faucet, pulls
const ceramic = new THREE.MeshPhysicalMaterial({ color: 0xf6f5f1, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05 });
const blackMetal = new THREE.MeshPhysicalMaterial({ color: 0x1c1c1c, roughness: 0.38, metalness: 0.65 });
const brass = new THREE.MeshPhysicalMaterial({ color: 0xc9a25e, roughness: 0.32, metalness: 1 });
const fixtures = [];
for (const f of DATA.fixtures ?? []) {
  const [sx, sy, sz] = f.box.size, [mx, my, mz] = f.box.min;
  let obj;
  if (f.kind === 'sink') {
    if (f.shape === 'round') {
      const r = sx / 2, t = 9;
      const prof = [[0, 0], [r * 0.6, 0], [r * 0.9, sy * 0.45], [r, sy], [r - t, sy], [r * 0.9 - t, sy * 0.45], [r * 0.6 - t, t], [0, t]]
        .map(([x, y]) => new THREE.Vector2(x, y));
      obj = new THREE.Group();
      const drain = new THREE.Mesh(new THREE.CircleGeometry(22, 32), blackMetal);
      drain.rotation.x = -Math.PI / 2; drain.position.y = t + 0.5;
      obj.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 96), ceramic), drain);
      obj.position.set(mx + r, my, mz + sz / 2);
    } else {
      // open basin: rounded-rectangle ring extruded up for the walls, plus a floor
      const rr = (w, d, r) => {
        const s = new THREE.Shape(), x = -w / 2, y = -d / 2;
        s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
        s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
        s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
        s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
        return s;
      };
      const wallT = 11, ring = rr(sx, sz, 40);
      ring.holes.push(rr(sx - 2 * wallT, sz - 2 * wallT, 30));
      const walls = new THREE.Mesh(new THREE.ExtrudeGeometry(ring, { depth: sy, bevelEnabled: true, bevelThickness: 3, bevelSize: 3, bevelSegments: 3, curveSegments: 12 }), ceramic);
      const base = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(sx - 2, sz - 2, 39), { depth: 14, bevelEnabled: false, curveSegments: 12 }), ceramic);
      const drain = new THREE.Mesh(new THREE.CircleGeometry(22, 32), blackMetal);
      drain.position.z = 14.5;                 // on the basin floor (extrusion space, before the rotation)
      obj = new THREE.Group();
      obj.add(walls, base, drain);
      obj.rotation.x = -Math.PI / 2;           // extrusion runs up from the countertop
      obj.position.set(mx + sx / 2, my, mz + sz / 2);
    }
  } else if (f.kind === 'faucet') {
    obj = new THREE.Group();
    const post = new THREE.Mesh(new THREE.CylinderGeometry(14, 17, sy, 32), blackMetal);
    const spout = new THREE.Mesh(new THREE.CylinderGeometry(10, 10, 175, 24), blackMetal);
    spout.rotation.x = Math.PI / 2; spout.position.set(0, sy / 2 - 14, 80);
    const lever = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 60, 12), blackMetal);
    lever.rotation.z = Math.PI / 2; lever.position.set(30, sy / 2 - 70, 0);
    obj.add(post, spout, lever);
    obj.position.set(mx + sx / 2, my + sy / 2, mz + sz / 2);
  } else if (f.kind === 'leg' && f.leg) {
    // tapered round leg from the mounting plate to the floor, splayed; grain runs along the leg
    const L = f.leg, top = new THREE.Vector3(...L.top), foot = new THREE.Vector3(...L.foot);
    const axis = top.clone().sub(foot), len = axis.length();
    const geo = new THREE.CylinderGeometry(L.topDia / 2, L.bottomDia / 2, len, 40, 1);
    const uvs = geo.attributes.uv;
    for (let i = 0; i < uvs.count; i++) uvs.setXY(i, uvs.getY(i) * len / VENEER_TILE, uvs.getX(i) * Math.PI * L.topDia / VENEER_TILE);
    obj = new THREE.Group();
    obj.add(new THREE.Mesh(geo, L.finish ? finishMat(L.finish, 'face') : blackMetal));
    if (L.ferrule) {
      const r = L.bottomDia / 2 + (L.topDia - L.bottomDia) / 2 * (L.ferrule / len);
      const tip = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.6, L.bottomDia / 2 + 0.6, L.ferrule, 40), brass);
      tip.position.y = -len / 2 + L.ferrule / 2;
      obj.add(tip);
    }
    obj.position.copy(top.clone().add(foot).multiplyScalar(0.5));
    obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), axis.normalize());
  } else if (f.kind === 'leg') {
    obj = new THREE.Mesh(new THREE.CylinderGeometry(sx / 2 - 3, sx / 2, sy, 32), blackMetal);
    obj.position.set(mx + sx / 2, my + sy / 2, mz + sz / 2);
  } else {
    obj = new THREE.Mesh(new RoundedBoxGeometry(sx, sy, sz, 4, Math.min(sy, sz) / 2.2), blackMetal);
    obj.position.set(mx + sx / 2, my + sy / 2, mz + sz / 2);
  }
  obj.traverse((m) => { m.castShadow = true; m.receiveShadow = true; });
  obj.userData = { kind: f.kind };
  group.add(obj);
  fixtures.push(obj);
}

// ---- room
const room = new THREE.Group();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.MeshStandardMaterial({ color: 0xc9c2b8, roughness: 0.85 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; floor.position.set(ov.width / 2, 0, 2000);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(8000, 2800), new THREE.MeshStandardMaterial({ color: 0xf2eee8, roughness: 0.95 }));
wall.position.set(ov.width / 2, 1400, -1); wall.receiveShadow = true;
room.add(floor, wall);
scene.add(room);

const center = new THREE.Vector3(ov.width / 2, ov.elevation + ov.height / 2, ov.depth / 2);
camera.position.set(center.x + ov.width * 0.75, center.y + 420, ov.depth + Math.max(ov.width, 900) * 1.55);
controls.target.copy(center);
controls.update();

// ---- UI
for (const [sel, key] of [['f-fronts', 'fronts'], ['f-carcass', 'carcass'], ['f-top', 'top']]) {
  const el = $(sel);
  for (const [id, f] of Object.entries(DATA.finishes)) el.add(new Option(f.name, id, false, id === choice[key]));
  el.addEventListener('change', () => { choice[key] = el.value; applyFinishes(); });
}
if (!DATA.parts.some((p) => p.role === 'top')) $('f-top').disabled = true;

function apply() {
  const showFronts = $('fronts').checked, open = $('open').checked, showTop = $('top').checked;
  for (const m of meshes) {
    const p = m.userData, r = p.role;
    m.visible = r === 'top' ? showTop : isFront(r) ? showFronts : true;
    m.position.copy(p.home);
    m.rotation.set(0, 0, 0);
    if (open && r.startsWith('drawer')) m.position.z += 300;
    if (open && r === 'door') {
      const left = p.name.includes('left');
      const b = p.box, pivotX = left ? b.min[0] : b.min[0] + b.size[0];
      const ang = (left ? -1 : 1) * Math.PI * 0.55;
      const off = new THREE.Vector3(m.position.x - pivotX, 0, m.position.z - b.min[2]).applyAxisAngle(new THREE.Vector3(0, 1, 0), ang);
      m.position.set(pivotX + off.x, m.position.y, b.min[2] + off.z);
      m.rotation.y = ang;
    }
  }
  for (const f of fixtures) f.visible = f.userData.kind === 'pull' ? showFronts && !open : f.userData.kind === 'leg' ? true : showTop;
  room.visible = $('room').checked;
}
for (const id of ['fronts', 'top', 'open', 'room']) $(id).addEventListener('change', apply);
applyFinishes();
apply();

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), hover = $('hover');
renderer.domElement.addEventListener('pointermove', (e) => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(meshes.filter((m) => m.visible), true)[0];
  hover.style.display = hit ? 'block' : 'none';
  if (hit) { const p = hit.object.userData; hover.textContent = `${p.id} - ${p.name} (${p.box.size.map((v) => v.toFixed(0)).join(' x ')} mm)`; }
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
// "Make it a photo": the render as a PNG (UI hidden) and a prompt that describes the piece exactly,
// so any image AI keeps the design and only adds the room, light and styling.
function photoPrompt() {
  const fin = (id) => (DATA.finishes[id]?.name ?? id).split(' (')[0].toLowerCase();
  const count = (r) => DATA.parts.filter((p) => p.role === r).length;
  const facts = [DATA.name, `${DATA.style} style`, `${fin(choice.fronts)} fronts`, `${fin(choice.carcass)} cabinet`];
  if (DATA.parts.some((p) => p.role === 'top')) facts.push(`${fin(choice.top)} top`);
  facts.push(DATA.parts.some((p) => p.banded) ? 'clean veneer edgebanding on every visible edge' : 'exposed Baltic birch plywood edges');
  if (count('drawerFront')) facts.push(`${count('drawerFront')} drawers`);
  if (count('door')) facts.push(`${count('door')} doors`);
  if ((DATA.fixtures ?? []).some((f) => f.kind === 'pull')) facts.push('slim black bar pulls near the top of each front');
  if ((DATA.fixtures ?? []).some((f) => f.kind === 'leg' && f.leg?.finish)) facts.push('tapered, slightly splayed solid wood legs with brass tips');
  return `Editorial interior photograph for a European design magazine. Use the cabinet in the reference image exactly as designed: ${facts.join(', ')}. ` +
    'Same proportions, same drawer and door count, same pulls and legs. Place it against the wall of a calm, sunlit room that suits it, ' +
    'with soft natural light, gentle shadows and a few simple styling objects. Medium format, natural color, quiet luxury. No text, no logos, no people.';
}
$('photo').addEventListener('click', async () => {
  const ui = $('ui'), hint = $('hint');
  ui.style.visibility = hint.style.visibility = 'hidden';
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL('image/png');
  ui.style.visibility = hint.style.visibility = '';
  const a = document.createElement('a');
  a.href = url; a.download = `${DATA.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase()}-render.png`; a.click();
  try { await navigator.clipboard.writeText(photoPrompt()); $('photoNote').textContent = 'Render downloaded, prompt copied. Paste both into your favourite image AI.'; }
  catch { $('photoNote').textContent = photoPrompt(); }
});
window.__photoPrompt = photoPrompt;

// "View in your room" (iPhone / iPad Safari, no app): the piece as USDZ, made right here in the browser,
// opened in AR Quick Look. One material per mesh (the face veneer), metres, centred on its footprint.
// phone-sized copies of the textures (AR Quick Look downloads the whole file before it shows anything)
const smallTex = new Map();
function small(t, size = 512) {
  if (!t?.image) return null;
  if (!smallTex.has(t.uuid)) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    c.getContext('2d').drawImage(t.image, 0, 0, size, size);
    const s = new THREE.CanvasTexture(c);
    s.wrapS = s.wrapT = THREE.RepeatWrapping;
    s.colorSpace = t.colorSpace;
    smallTex.set(t.uuid, s);
  }
  return smallTex.get(t.uuid);
}
const arMats = new Map();
function arMaterial(m) {
  if (!arMats.has(m.uuid)) {
    const a = new THREE.MeshStandardMaterial({ color: m.color, roughness: m.roughness ?? 0.6, metalness: m.metalness ?? 0 });
    a.map = small(m.map);
    // colour only: normal maps barely show at room scale and double the download
    arMats.set(m.uuid, a);
  }
  return arMats.get(m.uuid);
}

// The piece on its own, in metres, centred on its footprint: one mesh per part, named after it.
function exportRoot(material) {
  const root = new THREE.Group();
  root.name = DATA.name;
  root.scale.setScalar(0.001);
  root.position.set(-ov.width / 2000, 0, -ov.depth / 2000);
  scene.updateMatrixWorld(true);
  const inv = group.matrixWorld.clone().invert();
  group.traverse((o) => {
    if (!o.isMesh || !o.visible) return;
    const mats = Array.isArray(o.material) ? o.material : null;
    let mat = mats ? mats[(o.userData?.thicknessAxis ?? o.parent?.userData?.thicknessAxis ?? 1) * 2] ?? mats[0] : o.material;
    mat = material(mat, mats);
    const m = new THREE.Mesh(o.geometry, mat);
    m.name = o.name || o.parent?.name || '';
    m.matrix.copy(group.matrix).multiply(inv.clone().multiply(o.matrixWorld));
    m.matrix.decompose(m.position, m.quaternion, m.scale);
    root.add(m);
  });
  return root;
}

async function usdz() {
  const root = exportRoot((mat) => (mat.isMeshStandardMaterial ? arMaterial(mat) : new THREE.MeshStandardMaterial({ color: mat.color ?? 0x888888 })));
  const exporter = new USDZExporter();
  const opts = { quickLookCompatible: true, maxTextureSize: 512 };
  const data = exporter.parseAsync ? await exporter.parseAsync(root, opts) : await exporter.parse(root, opts);
  return new Blob([data], { type: 'model/vnd.usdz+zip' });
}
const arLink = document.createElement('a');
if (arLink.relList?.supports?.('ar')) {
  $('inroom').hidden = false;
  $('inroom').addEventListener('click', async () => {
    $('inroom').textContent = 'Preparing…';
    try {
      arLink.rel = 'ar';
      arLink.href = URL.createObjectURL(await usdz());
      arLink.download = `${DATA.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase()}.usdz`;
      arLink.appendChild(document.createElement('img'));   // AR Quick Look wants an <img> inside the link
      arLink.click();
    } finally { $('inroom').textContent = 'View in your room'; }
  });
}
window.__usdz = usdz;

// Take it further: the model for Blender or any 3D tool, and the design as text for any AI to edit.
// Plywise has no AI inside; the design format is plain JSON, and the engine rebuilds whatever comes
// back by its own rules, so an edited design is still a buildable one (or it says why not).
const fileBase = DATA.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$('glb').addEventListener('click', async () => {
  // full materials (veneer per face, normal + roughness maps) for editing
  const root = exportRoot((mat, mats) => (mats ?? [mat]).find((x) => x.isMeshStandardMaterial) ?? mat);
  const data = await new GLTFExporter().parseAsync(root, { binary: true, maxTextureSize: 1024 });
  download(new Blob([data], { type: 'model/gltf-binary' }), `${fileBase}.glb`);
});
$('usdzfile').addEventListener('click', async () => download(await usdz(), `${fileBase}.usdz`));
if (window.__spec) {
  for (const id of ['aicopy', 'aipaste']) $(id).hidden = false;
  const aiPrompt = () => 'This is a cabinet design in Plywise format (JSON, millimetres; plywise.xyz). ' +
    'Change it as I ask below and give back the whole JSON only. Keep the format: cabinets are boxes side by side, ' +
    'each with zones from the bottom up (drawer, doors, open), sizes in mm or "fill". Fill drawers graduate by the golden ratio. ' +
    'Style options include preset (classic-euro, ply-inset, recessed-inset, milan-flush), grainMatch (across, waterfall, off), ' +
    'rhythm (golden, even), frontFinish, carcassFinish, topFinish.\n\n' + JSON.stringify(window.__spec, null, 1) + '\n\nMy change: ';
  $('aicopy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(aiPrompt()); $('aiNote').textContent = 'Copied. Paste it into any AI chat, add what you want changed, then paste its answer back here.'; }
    catch { $('aitext').hidden = false; $('aitext').value = aiPrompt(); $('aiNote').textContent = 'Copy this into any AI chat.'; }
  });
  $('aipaste').addEventListener('click', () => { $('aitext').hidden = $('aiload').hidden = false; $('aitext').value = ''; $('aitext').focus(); });
  $('aiload').addEventListener('click', () => {
    const text = $('aitext').value;
    try {
      const spec = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
      const check = JSON.parse(Plywise.design(JSON.stringify(spec)));
      if (check.error) { $('aiNote').textContent = `Plywise can't build that: ${check.error}`; return; }
      const b = btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(spec)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      location.hash = b;   // the page reloads with the new design (and it's a link you can share)
    } catch (e) { $('aiNote').textContent = `That isn't a Plywise design: ${e.message}`; }
  });
}
window.__view = (pos, target) => { camera.position.set(...pos); controls.target.set(...target); controls.update(); };
window.__setFinish = (key, id) => { choice[key] = id; $('f-' + key).value = id; applyFinishes(); };
window.__ready = true;
</script>
</body>
</html>
